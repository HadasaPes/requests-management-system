<div class="table-container">
  <table
    mat-table
    [dataSource]="items()"
    matSort
    matSortDisableClear
    [matSortActive]="sort().sortBy"
    [matSortDirection]="sort().sortDirection"
    (matSortChange)="onSort($event)"
  >
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>#</th>
      <td mat-cell *matCellDef="let r">{{ r.id }}</td>
    </ng-container>

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
      <td mat-cell *matCellDef="let r" class="title">{{ r.title }}</td>
    </ng-container>

    <ng-container matColumnDef="organizationName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Organization</th>
      <td mat-cell *matCellDef="let r">{{ r.organizationName }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let r"><span class="chip status-{{ r.status }}">{{ r.status }}</span></td>
    </ng-container>

    <ng-container matColumnDef="priority">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Priority</th>
      <td mat-cell *matCellDef="let r"><span class="chip priority-{{ r.priority }}">{{ r.priority }}</span></td>
    </ng-container>

    <ng-container matColumnDef="assignedTo">
      <th mat-header-cell *matHeaderCellDef>Assigned to</th>
      <td mat-cell *matCellDef="let r">
        @if (r.assignedTo) {
          {{ r.assignedTo }}
        } @else {
          <span class="muted">Unassigned</span>
        }
      </td>
    </ng-container>

    <!-- The API returns UTC; the date pipe shows it in the browser's local time. -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Created</th>
      <td mat-cell *matCellDef="let r" class="date">{{ r.createdAt | date: 'd MMM y, HH:mm' }}</td>
    </ng-container>

    <ng-container matColumnDef="updatedAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Updated</th>
      <td mat-cell *matCellDef="let r" class="date">{{ r.updatedAt | date: 'd MMM y, HH:mm' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>

<mat-paginator
  [length]="totalCount()"
  [pageIndex]="page() - 1"
  [pageSize]="pageSize()"
  [pageSizeOptions]="pageSizeOptions"
  showFirstLastButtons
  (page)="onPage($event)"
  aria-label="Select page of requests"
/>
